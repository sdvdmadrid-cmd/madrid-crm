name: Security Preflight

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional deployed base URL. Leave empty to run against local app.
        required: false
        default: ""

jobs:
  preflight:
    name: Run Security Preflight
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_security_preflight_only
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BILL_AUTOPAY_CRON_SECRET: ci-bill-autopay-cron-secret-for-build-only
      EMAIL_PROVIDER: mock
      EMAIL_FROM: FieldBase <noreply@example.com>
      EMAIL_WEBHOOK_SECRET: ci-email-webhook-secret-0123456789abcdef
      DEV_LOGIN_ENABLED: false
      NEXT_PUBLIC_DEV_LOGIN_ENABLED: false
      ALLOW_INSECURE_DEV_WEBHOOKS: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve target base URL
        id: target
        shell: bash
        run: |
          BASE_URL="${{ inputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="http://127.0.0.1:3000"
            LOCAL_TARGET="true"
          else
            LOCAL_TARGET="false"
          fi
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "local_target=$LOCAL_TARGET" >> "$GITHUB_OUTPUT"
          echo "Using BASE_URL=$BASE_URL"

      - name: Build app (local target)
        if: ${{ steps.target.outputs.local_target == 'true' }}
        run: npm run build

      - name: Start app and wait for health (local target)
        if: ${{ steps.target.outputs.local_target == 'true' }}
        shell: bash
        run: |
          nohup npm run start -- -p 3000 > /tmp/next-start.log 2>&1 &
          for i in {1..90}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
            if [ "$CODE" = "200" ]; then
              echo "App is healthy (HTTP 200)"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          tail -n 200 /tmp/next-start.log || true
          exit 1

      - name: Run security preflight
        shell: pwsh
        run: |
          ./scripts/security-preflight.ps1 -BaseUrl "${{ steps.target.outputs.base_url }}" -JsonOutputPath "./security-preflight-report.json"

      - name: Upload security preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-preflight-report
          path: security-preflight-report.json
