name: Preview Build Guard

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Next Build (PR)
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: http://127.0.0.1:3000
      APP_URL: http://127.0.0.1:3000
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      BILL_AUTOPAY_CRON_SECRET: ci-bill-autopay-cron-secret-for-build-only
      EMAIL_PROVIDER: mock
      EMAIL_FROM: FieldBase <noreply@example.com>
      EMAIL_WEBHOOK_SECRET: ci-email-webhook-secret-0123456789abcdef
      DEV_LOGIN_ENABLED: false
      NEXT_PUBLIC_DEV_LOGIN_ENABLED: false
      ALLOW_INSECURE_DEV_WEBHOOKS: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Schema security check (migrations RLS lint)
        run: npm run security:check:ci

      - name: Schema security check (changed migration files)
        if: github.event_name == 'pull_request'
        run: npm run validate:migrations-rls:changed

      - name: Build
        run: npm run build
