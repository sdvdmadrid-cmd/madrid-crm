# After every push to main, verify production serves the same commit (no stale deploy).
name: Production Deploy Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Verify fieldbaseapp.net matches main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for Vercel production deploy
        run: sleep 120

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run deployment pipeline audit
        env:
          APP_BASE_URL: https://fieldbaseapp.net
        run: node scripts/deployment-pipeline-audit.mjs

      - name: Assert health commit matches GitHub SHA
        env:
          APP_BASE_URL: https://fieldbaseapp.net
        run: |
          EXPECTED="${GITHUB_SHA:0:12}"
          ACTUAL=$(curl -fsS "$APP_BASE_URL/api/health" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); process.stdout.write(String(d.commitSha||'').slice(0,12))")
          echo "Expected (main): $EXPECTED"
          echo "Production:      $ACTUAL"
          test "$EXPECTED" = "$ACTUAL" || { echo "::error::Production commitSha does not match push SHA"; exit 1; }
